name: Build MeowSynth
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp -R build/MeowSynth_artefacts/Release/VST3 out/ || cp -R build/MeowSynth_artefacts/VST3 out/
          [ -d build/MeowSynth_artefacts/Release/AU ] && cp -R build/MeowSynth_artefacts/Release/AU out/ || true
          [ -d build/MeowSynth_artefacts/Release/Standalone ] && cp -R build/MeowSynth_artefacts/Release/Standalone out/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: MeowSynth-${{ matrix.name }}
          path: out

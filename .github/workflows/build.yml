name: Build MeowSynth
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target MeowSynth_VST3 MeowSynth_Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: MeowSynth-Windows
          path: |
            build/MeowSynth_artefacts/Release/VST3/MeowSynth.vst3
            build/MeowSynth_artefacts/Release/Standalone/MeowSynth.exe
